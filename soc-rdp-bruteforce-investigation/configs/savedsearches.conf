# Splunk savedsearches.conf
# Location: /opt/splunk/etc/apps/search/local/savedsearches.conf

[SOC_Alert_RDP_Brute_Force_Detected]
action.email = 0
action.email.useNSSubject = 1
alert.severity = 4
alert.suppress = 1
alert.suppress.fields = src_ip,user
alert.suppress.period = 30m
alert.track = 1
counttype = number of events
cron_schedule = */5 * * * *
description = Triggers when more than 10 RDP logon failures (EventCode 4625, Logon_Type 10) occur from a single source IP within a 5-minute window.
dispatch.earliest_time = -5m
dispatch.latest_time = now
enableSched = 1
quantity = 0
relation = greater than
search = index=wineventlog EventCode=4625 (Logon_Type=10 OR LogonType=10) | stats count as Failed_Attempts, values(user) as Targeted_Users, values(Workstation_Name) as Source_Workstation, earliest(_time) as First_Seen, latest(_time) as Last_Seen by src_ip | where Failed_Attempts >= 10 | eval Duration_Seconds=Last_Seen-First_Seen | convert ctime(First_Seen) ctime(Last_Seen)

[SOC_Alert_RDP_Brute_Force_Followed_By_Success]
alert.severity = 5
alert.track = 1
cron_schedule = */5 * * * *
description = Critical alert triggering when multiple failed RDP attempts from an IP are followed by a successful login (credential compromise).
dispatch.earliest_time = -15m
dispatch.latest_time = now
enableSched = 1
quantity = 0
relation = greater than
search = index=wineventlog (EventCode=4625 OR EventCode=4624) (Logon_Type=10 OR LogonType=10) | eval Status=if(EventCode=4625, "Failure", "Success") | stats count(eval(Status="Failure")) as Failures, count(eval(Status="Success")) as Successes, values(user) as Users by src_ip | where Failures >= 5 AND Successes >= 1
