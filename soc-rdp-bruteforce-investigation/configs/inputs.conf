# Splunk Universal Forwarder inputs.conf
# Location: C:\Program Files\SplunkUniversalForwarder\etc\system\local\inputs.conf

[default]
host = WIN-TARGET-01

# Ingest Windows Security Logs (Event IDs 4624, 4625, 4672, 4740)
[WinEventLog://Security]
disabled = 0
start_from = oldest
current_only = 0
checkpointInterval = 5
index = wineventlog
renderXml = false

# Ingest Windows System Logs
[WinEventLog://System]
disabled = 0
start_from = oldest
current_only = 0
checkpointInterval = 5
index = wineventlog
renderXml = false

# Ingest RDP Terminal Services Remote Connection Manager Logs (Event ID 1149)
[WinEventLog://Microsoft-Windows-TerminalServices-RemoteConnectionManager/Operational]
disabled = 0
start_from = oldest
current_only = 0
checkpointInterval = 5
index = wineventlog
renderXml = false

# Ingest RDP Local Session Manager Logs
[WinEventLog://Microsoft-Windows-TerminalServices-LocalSessionManager/Operational]
disabled = 0
start_from = oldest
current_only = 0
checkpointInterval = 5
index = wineventlog
renderXml = false
